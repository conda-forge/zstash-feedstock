{% set name = "zstash" %}
{% set version = "1.6.0rc1" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/E3SM-Project/zstash/archive/v{{ version }}.tar.gz
  sha256: 1f0d08b264dd8bf06266369b0377ea3a44519c674781f1e402626f0a2974173a

build:
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps -vv"
  noarch: python

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools

  run:
    - python >={{ python_min }}
    - sqlite
    - six >=1.16.0
    - globus-sdk >=3.15.0,<4.0

test:
  imports:
    - zstash
  commands:
    - zstash --help
    # Disabled until we update fair-research-login because of typo:
    # https://github.com/fair-research/native-login/blob/v0.2.6/requirements.txt
    # - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/E3SM-Project/zstash
  summary: 'Long term HPSS archiving tool for E3SM'
  license: BSD-3-Clause and custom
  license_file:
    - LICENSE
    - NOTICE

extra:
  recipe-maintainers:
    - mahf708
    - xylar
    - tomvothecoder
    - forsyth2
    - chengzhuzhang
