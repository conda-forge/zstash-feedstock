schema_version: 1

context:
  name: zstash
  version: "1.6.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/E3SM-Project/zstash/archive/v${{ version }}.tar.gz
  sha256: 7a9fff054c2af611e282c96bbd96f9cffbe9f2f6c432eb2c7a23a98ae9c6685f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }},<3.15
    - sqlite
    - six >=1.16.0
    - globus-sdk >=3.15.0,<4.0.0

tests:
  - python:
      imports:
        - zstash
      pip_check: false
      python_version:
        - ${{ python_min }}
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - zstash --help

about:
  summary: Long term HPSS archiving tool for E3SM
  license: BSD-3-Clause and LicenseRef-Custom
  license_file:
    - LICENSE
    - NOTICE
  homepage: https://github.com/E3SM-Project/zstash

extra:
  recipe-maintainers:
    - andrewdnolan
    - mahf708
    - xylar
    - tomvothecoder
    - forsyth2
    - chengzhuzhang
